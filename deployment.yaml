
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-kubernetes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-kubernetes-app
  template:
    metadata:
      labels:
        app: java-kubernetes-app
    spec:
      containers:
        - name: java-kubernetes-app
          image: kavyadharshinil/java-kubernetes-app:latest
          imagePullPolicy: Always
